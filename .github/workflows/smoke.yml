# Install smoke tests of the exact release artifacts (Story 9.7, AD-24, A-13,
# A-14). Actions are pinned to commit SHAs (the comment gives the tag).
#
# The release workflow leaves a DRAFT release plus the image tagged with the
# exact version. This workflow installs those exact artifacts on clean
# environments: the deb (Debian 13 with systemd, amd64 and arm64 under QEMU),
# the rpm (Fedora with systemd), bootstrap.sh (alpine and debian), the image by
# digest (fresh, restored and unprepared data dirs, UID 65532), the macOS
# binary and the Windows preview zip. Every job first downloads the assets of
# the release and verifies checksums.txt against its cosign bundle and the
# release workflow identity (test/smoke/fetch.sh). It never publishes anything:
# publish.yml calls it and publishes only when every job passed. It can also be
# run by hand for a tag (workflow_dispatch), for example to repeat a failed job.
#
# The jobs read the draft release, which GitHub shows only to a token with
# write access, so they get contents: write. That token (GH_TOKEN) is given to
# the step that runs test/smoke/fetch.sh and to no other step: the steps that
# execute the artifacts under test (the binary, minion.exe, the packages, the
# image) must not be able to edit or publish the draft.
#
# Exact artifacts: publish.yml records the sha256 of the draft's checksums.txt
# (checksums_sha256) and fetch.sh refuses any other checksums.txt; the image job
# outputs the digest it verified and tested (image_digest) so that publish.yml
# moves the channels to that digest.
name: smoke

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, vX.Y.Z or vX.Y.Z-rc.N
        type: string
        required: true
      checksums_sha256:
        description: sha256 of the checksums.txt of the draft, recorded by publish.yml; any other checksums.txt is refused
        type: string
        required: true
    outputs:
      image_digest:
        description: The image digest (sha256:...) that the image job verified and tested
        value: ${{ jobs.image.outputs.digest }}
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, vX.Y.Z or vX.Y.Z-rc.N
        type: string
        required: true
      checksums_sha256:
        description: Optional sha256 of the checksums.txt of the draft (empty is not pinned)
        type: string
        required: false

permissions:
  contents: read

env:
  COSIGN_VERSION: v3.1.4

jobs:
  deb:
    name: deb on Debian 13 (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # read the draft release
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: QEMU for the arm64 container
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Download the exact draft assets and verify them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # only this step may read the draft
          SMOKE_CHECKSUMS_SHA256: ${{ inputs.checksums_sha256 }}
        run: test/smoke/fetch.sh "$TAG" assets "*_${{ matrix.arch }}.deb"
      - name: Install the deb and check version, Worker unit and status
        run: test/smoke/deb.sh assets "$TAG" "${{ matrix.arch }}"

  rpm:
    name: rpm on Fedora
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # read the draft release
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Download the exact draft assets and verify them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # only this step may read the draft
          SMOKE_CHECKSUMS_SHA256: ${{ inputs.checksums_sha256 }}
        run: test/smoke/fetch.sh "$TAG" assets "*.x86_64.rpm"
      - name: Install the rpm and check version, Worker unit and status
        run: test/smoke/rpm.sh assets "$TAG"

  bootstrap:
    name: bootstrap.sh in alpine and debian
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # read the draft release
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Download the exact draft assets and verify them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # only this step may read the draft
          SMOKE_CHECKSUMS_SHA256: ${{ inputs.checksums_sha256 }}
        run: test/smoke/fetch.sh "$TAG" assets "*_linux_amd64.tar.gz" "bootstrap.sh"
      - name: Run the release bootstrap.sh in alpine and debian
        run: test/smoke/bootstrap.sh assets "$TAG"

  image:
    name: image by digest (UID 65532, fresh, restored, unprepared)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # read the draft release (the image check needs no asset)
      packages: read # pull ghcr.io/patrick-1984/minion
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Log in to ghcr.io (the token goes through stdin, not argv)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Download checksums.txt of the exact draft and verify its cosign bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # only this step may read the draft
          SMOKE_CHECKSUMS_SHA256: ${{ inputs.checksums_sha256 }}
        run: test/smoke/fetch.sh "$TAG" assets "checksums.txt"
      - name: Pull the image by digest and run the Hub on fresh, restored and unprepared data dirs
        id: image
        # The digest that was verified and tested goes to the job output.
        run: SMOKE_DIGEST_OUTPUT="$GITHUB_OUTPUT" test/smoke/image.sh "$TAG"

  macos:
    name: macOS binary (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: write # read the draft release
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Install tmux (the Worker drives it)
        run: brew install tmux
      - name: Download the exact draft assets and verify them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # only this step may read the draft
          SMOKE_CHECKSUMS_SHA256: ${{ inputs.checksums_sha256 }}
        run: |
          case "$(uname -m)" in arm64) arch=arm64 ;; *) arch=amd64 ;; esac
          test/smoke/fetch.sh "$TAG" assets "*_darwin_${arch}.tar.gz"
      - name: Run version and a foreground Worker on a private tmux socket
        run: test/smoke/macos.sh assets "$TAG"

  windows:
    name: Windows preview zip
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write # read the draft release
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Download the exact draft assets and verify them
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # only this step may read the draft
          SMOKE_CHECKSUMS_SHA256: ${{ inputs.checksums_sha256 }}
        run: test/smoke/fetch.sh "$TAG" assets "*_windows_amd64_preview.zip"
      - name: Run version and a foreground Worker from the zip
        shell: pwsh
        run: ./test/smoke/windows.ps1 -Assets assets -Tag $env:TAG

  # One job that is green only when every smoke job passed; publish.yml waits
  # for the whole workflow, and this name is the one to require elsewhere.
  smoke-passed:
    name: all smoke tests passed
    if: always()
    needs: [deb, rpm, bootstrap, image, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Every smoke job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
