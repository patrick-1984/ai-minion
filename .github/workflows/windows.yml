# Windows runner (AD-25). Story 8.1: the ConPTY session host; its tests start
# real programs (cmd, pwsh) in a real pseudo console, so they run on a Windows
# runner only. Story 8.2: the Windows-tagged tests of the identity and store
# packages (A-11: protected DACLs), the named pipe and the Windows service
# packages, a foreground Worker that the CLI reaches over its named pipe and
# that runs session operations, and the real Windows service (install, start,
# restart after a crash, stop, state still readable by the installing user).
# Actions are pinned to commit SHAs (the comment gives the tag).
name: windows

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conpty:
    name: ConPTY session host
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the Worker packages for Windows (CGO_ENABLED=0)
        shell: bash
        run: CGO_ENABLED=0 go build ./...
      - name: ConPTY tests against real pseudo consoles (CGO_ENABLED=0, as released)
        shell: bash
        run: CGO_ENABLED=0 go test -count=1 -v ./internal/worker/term/conpty/
      - name: ConPTY tests with the race detector
        shell: bash
        run: CGO_ENABLED=1 go test -race -count=1 ./internal/worker/term/conpty/

  windows-tagged:
    name: Windows-tagged tests (DACLs, named pipe, service)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Story 1.6 (internal/identity/perm_windows_test.go: protected DACL for
      # the owner SID and SYSTEM, save into a permissive directory, refusal to
      # load a key whose DACL grants others read), Story 2.3 (Worker state
      # files), Story 8.2 (named pipe, pipe client, Windows service, and the
      # private DACL of a SYSTEM service that serves the installing user).
      # The identity, store and service packages also hold tests of Unix
      # behaviour (modes, uids, chown), so those three run the Windows and
      # platform-neutral tests of this story by name; the localapi and client
      # packages run completely.
      - name: Windows-tagged tests (CGO_ENABLED=0, as released)
        shell: bash
        run: |
          set -eu
          identity='^(TestSaveKeyProtectedDACL|TestWritePrivateProtectedDACL|TestCreatePrivateTempProtectedAtCreation|TestLoadKeyRefusesOtherPrincipals|TestLoadKeyAcceptsOwnerAndSystem|TestLoadKeyUsesOpenPrivateChecks|TestLoadKeyRefusesConditionalAllowACE|TestPrivateACLForAPinnedUserGrantsThatUserAndSystem|TestPrivateUserIgnoresThePinOutsideSystem|TestPrivateUserSID|TestValidSID|TestPipeUserSIDEnvName|TestReadAPIKeyFileOfAPrivateFile)$'
          store='^(TestOpenCreatesProtectedDatabaseInPermissiveDir|TestOpenProtectsExistingPermissiveStateDir|TestMigrationBackupIsPrivateInPermissiveDir|TestApplyPrivateDACLForAPinnedUserGrantsThatUserAndSystem)$'
          service='^(TestSCM|TestPipeUserSIDEnv|TestWindows|TestNewConfigController|TestInstallOnWindows|TestCurrentUserSID|TestIsAccessDenied)'
          hubstore='^(TestRestoreRefusesAnArchiveWithoutTheRecordedIdentityKey|TestRestoreRefusesAMismatchedIdentityKey|TestRestoreRefusesAnExcessiveScryptWorkFactorWithoutRunningIt|TestRestoreRefusesDeclaredSizesOfSmallFiles|TestRestoreEnforcesTheTotalSizeLimit|TestRestoreWithACancelledContextStopsAndLeavesNothing|TestRestoreRequiresAVerifiedGzipEnd|TestARejectedRestoreLeavesAnAbsentDestinationAbsent|TestEncryptedBackupRoundTripDecryptsTheOIDCSecret|TestRestoreCountsExtensionHeadersAgainstTheBudget|TestRestoreStopsOnACancelledContextWhileReadingExtensionHeaders|TestRestoreRefusesADecryptedStreamOverTheLimitWithSmallManifestTotals|TestFailedRestoreRemovesTheAncestorDirectoriesItCreated)$'
          cli='^(TestHubRestoreMaxSizeRefusesAnOversizedArchive|TestHubBackupWithoutAnEncryptionChoiceIsRefused)$'
          CGO_ENABLED=0 go test -count=1 -v -run "$identity" ./internal/identity/
          CGO_ENABLED=0 go test -count=1 -v -run "$hubstore" ./internal/hub/store/
          CGO_ENABLED=0 go test -count=1 -v -run "$cli" ./internal/cli/
          CGO_ENABLED=0 go test -count=1 -v -run "$store" ./internal/worker/store/
          CGO_ENABLED=0 go test -count=1 -v -run "$service" ./internal/worker/service/
          CGO_ENABLED=0 go test -count=1 -v ./internal/worker/localapi/ ./internal/client/
          agent='^(TestHubPipeModuleCallsWithTheWorkerCallKeyFile|TestCallKeySourceRereadsAndChecksTheKeyFile|TestSessionHostSpec.*)$'
          version='^(TestCheckTrustedDirInheritableACEs|TestCheckTrustedDirAncestorInheritOnly|TestCacheStagingBoundary|TestNewFileInheritedACL|TestReplaceBinaryInstallDirBoundary|TestDefaultUserInstallPath|TestReplaceBinary|TestCheckTrustedExecutable.*)$'
          CGO_ENABLED=0 go test -count=1 -v -run "$agent" ./internal/worker/agent/
          CGO_ENABLED=0 go test -count=1 -v -run "$version" ./internal/version/
      - name: Windows-tagged tests with the race detector
        shell: bash
        run: |
          set -eu
          identity='^(TestSaveKeyProtectedDACL|TestWritePrivateProtectedDACL|TestCreatePrivateTempProtectedAtCreation|TestLoadKeyRefusesOtherPrincipals|TestLoadKeyAcceptsOwnerAndSystem|TestLoadKeyUsesOpenPrivateChecks|TestLoadKeyRefusesConditionalAllowACE|TestPrivateACLForAPinnedUserGrantsThatUserAndSystem|TestPrivateUserIgnoresThePinOutsideSystem|TestPrivateUserSID|TestValidSID|TestPipeUserSIDEnvName|TestReadAPIKeyFileOfAPrivateFile)$'
          store='^(TestOpenCreatesProtectedDatabaseInPermissiveDir|TestOpenProtectsExistingPermissiveStateDir|TestMigrationBackupIsPrivateInPermissiveDir|TestApplyPrivateDACLForAPinnedUserGrantsThatUserAndSystem)$'
          service='^(TestSCM|TestPipeUserSIDEnv|TestWindows|TestNewConfigController|TestInstallOnWindows|TestCurrentUserSID|TestIsAccessDenied)'
          hubstore='^(TestRestoreRefusesAnArchiveWithoutTheRecordedIdentityKey|TestRestoreRefusesAMismatchedIdentityKey|TestRestoreRefusesAnExcessiveScryptWorkFactorWithoutRunningIt|TestRestoreRefusesDeclaredSizesOfSmallFiles|TestRestoreEnforcesTheTotalSizeLimit|TestRestoreWithACancelledContextStopsAndLeavesNothing|TestRestoreRequiresAVerifiedGzipEnd|TestARejectedRestoreLeavesAnAbsentDestinationAbsent|TestEncryptedBackupRoundTripDecryptsTheOIDCSecret|TestRestoreCountsExtensionHeadersAgainstTheBudget|TestRestoreStopsOnACancelledContextWhileReadingExtensionHeaders|TestRestoreRefusesADecryptedStreamOverTheLimitWithSmallManifestTotals|TestFailedRestoreRemovesTheAncestorDirectoriesItCreated)$'
          cli='^(TestHubRestoreMaxSizeRefusesAnOversizedArchive|TestHubBackupWithoutAnEncryptionChoiceIsRefused)$'
          CGO_ENABLED=1 go test -race -count=1 -run "$identity" ./internal/identity/
          CGO_ENABLED=1 go test -race -count=1 -run "$hubstore" ./internal/hub/store/
          CGO_ENABLED=1 go test -race -count=1 -run "$cli" ./internal/cli/
          CGO_ENABLED=1 go test -race -count=1 -run "$store" ./internal/worker/store/
          CGO_ENABLED=1 go test -race -count=1 -run "$service" ./internal/worker/service/
          CGO_ENABLED=1 go test -race -count=1 ./internal/worker/localapi/ ./internal/client/
          agent='^(TestHubPipeModuleCallsWithTheWorkerCallKeyFile|TestCallKeySourceRereadsAndChecksTheKeyFile)$'
          version='^(TestCheckTrustedDirInheritableACEs|TestCheckTrustedDirAncestorInheritOnly|TestCacheStagingBoundary|TestNewFileInheritedACL|TestReplaceBinaryInstallDirBoundary|TestDefaultUserInstallPath|TestReplaceBinary|TestCheckTrustedExecutable.*)$'
          CGO_ENABLED=1 go test -race -count=1 -run "$agent" ./internal/worker/agent/
          CGO_ENABLED=1 go test -race -count=1 -run "$version" ./internal/version/

  worker-foreground:
    name: Foreground Worker over the named pipe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build minion.exe (CGO_ENABLED=0, as released)
        shell: bash
        run: CGO_ENABLED=0 go build -o minion.exe ./cmd/minion
      - name: Start a foreground Worker and reach it over its pipe
        shell: bash
        run: |
          set -eu
          export MINION_STATE_DIR="$RUNNER_TEMP/minion-state"
          ./minion.exe worker up --foreground --share-existing all > worker.log 2>&1 &
          worker=$!
          ok=0
          for _ in $(seq 1 30); do
            if ./minion.exe worker status --json > status.json 2>status.err && grep -q '"live": true' status.json; then
              ok=1
              break
            fi
            sleep 1
          done
          cat status.json || true
          ./minion.exe worker status || true
          # sessions_list, session_create (a ConPTY session), send_text and
          # sessions_list again, over the pipe, against this running Worker
          # (test/e2e/windows_pipe_test.go; the `mn` CLI of Story 2.9 is not
          # part of the gate).
          e2e=0
          if [ "$ok" = 1 ]; then
            MINION_E2E_PIPE=1 CGO_ENABLED=0 go test -tags e2e -count=1 -v -run TestWindowsPipeSessionOps ./test/e2e/ || e2e=1
          fi
          kill "$worker" 2>/dev/null || true
          if [ "$e2e" != 0 ]; then
            echo "the session operations over the named pipe failed"
            cat worker.log || true
            exit 1
          fi
          if [ "$ok" != 1 ]; then
            echo "the CLI did not reach the foreground Worker over its named pipe"
            cat worker.log status.err || true
            exit 1
          fi
          # The preview label (R98) and the pipe of this user.
          grep -q '"platform": "windows"' status.json
          grep -q '"preview": true' status.json
          grep -q 'control socket listening' worker.log
          grep -q 'minion-worker-S-1-' worker.log
      # Tray ticket W2b, acceptance 8: ConPTY sessions live inside the Worker
      # and end with it, so "worker stop" counts them first (worker_lifecycle+
      # lifecycle.v1): with 2 sessions it exits 23 sessions_would_end with
      # sessions_lost 2 and stops nothing (both sessions still listed), one
      # accepted loss is not enough, and --accept-loss 2 stops. A foreground
      # Worker is used: the service runs as LocalSystem, and its ConPTY
      # sessions would run as that account (the windows service note).
      - name: 'W2b: ConPTY sessions refuse a stop until their loss is accepted'
        shell: bash
        run: |
          set -u
          export MINION_STATE_DIR="$RUNNER_TEMP/minion-state-w2b"
          # The Worker of the step before must be gone: the pipe is per user.
          for _ in $(seq 1 30); do
            ./minion.exe worker status --json > pre.json 2>/dev/null || true
            grep -q '"live": true' pre.json || break
            sleep 1
          done
          if grep -q '"live": true' pre.json; then echo "the Worker of the step before still runs"; exit 1; fi
          ./minion.exe worker up --foreground --share-existing all > w2b.log 2>&1 &
          worker=$!
          fail() { echo "FAIL: $*"; cat w2b.log || true; kill "$worker" 2>/dev/null || true; exit 1; }
          ok=0
          for _ in $(seq 1 30); do
            if ./minion.exe worker status --json > w2b-status.json 2>/dev/null && grep -q '"live": true' w2b-status.json; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || fail "the foreground Worker did not answer"
          grep -q '"session_host": "conpty"' w2b-status.json || { cat w2b-status.json; fail "the session host is not conpty"; }
          for n in w2b-one w2b-two; do
            rc=0; ./minion.exe session_create --name "$n" --argv cmd.exe --json > "create-$n.json" 2>&1 || rc=$?
            cat "create-$n.json"
            [ "$rc" = 0 ] || fail "session_create $n exited $rc"
          done
          listed() {
            ./minion.exe sessions_list --json > list.json 2> list.err || { cat list.json list.err; fail "sessions_list failed"; }
            cat list.json
            jq -e '[.sessions[].name] | index("w2b-one") != null and index("w2b-two") != null' list.json > /dev/null || fail "both sessions are not listed ($1)"
          }
          listed "before the stop"
          rc=0; ./minion.exe worker stop --json > stop1.json 2> stop1.err || rc=$?
          cat stop1.json stop1.err
          [ "$rc" = 23 ] || fail "worker stop exited $rc, want 23"
          jq -e '.code == "sessions_would_end" and .sessions_lost == 2 and .ok == false' stop1.json > /dev/null || fail "the refusal is not sessions_would_end with sessions_lost 2"
          listed "after the refusal"
          # One accepted loss is not enough for two sessions.
          rc=0; ./minion.exe worker stop --accept-loss 1 --json > stop2.json 2> stop2.err || rc=$?
          cat stop2.json stop2.err
          [ "$rc" = 23 ] || fail "worker stop --accept-loss 1 exited $rc, want 23"
          listed "after the second refusal"
          ./minion.exe worker status --json > w2b-status.json 2>/dev/null || true
          grep -q '"live": true' w2b-status.json || fail "the Worker does not run after the refusals"
          rc=0; ./minion.exe worker stop --accept-loss 2 --json > stop3.json 2> stop3.err || rc=$?
          cat stop3.json stop3.err
          [ "$rc" = 0 ] || fail "worker stop --accept-loss 2 exited $rc, want 0"
          jq -e '.ok == true and .stopped == true and .sessions_lost == 2' stop3.json > /dev/null || fail "the stop result is not ok/stopped/sessions_lost 2"
          ./minion.exe worker status --json > w2b-after.json 2>/dev/null || true
          grep -q '"live": false' w2b-after.json || { cat w2b-after.json; fail "the Worker still answers after the stop"; }

  worker-service:
    name: Windows service (install, start, restart, stop)
    runs-on: windows-latest # runs elevated, which installing a service needs
    timeout-minutes: 15
    env:
      MSYS_NO_PATHCONV: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The runner context is not available in a job-level env block.
      - name: State directory of the service test
        shell: bash
        run: echo "MINION_STATE_DIR=$(cygpath -w "$RUNNER_TEMP")\\minion-state" >> "$GITHUB_ENV"
      - name: Build minion.exe (CGO_ENABLED=0, as released)
        shell: bash
        run: CGO_ENABLED=0 go build -o minion.exe ./cmd/minion
      - name: Install and start the service (minion worker up, no --foreground)
        shell: bash
        run: |
          set -eu
          ./minion.exe worker up --share-existing none 2>&1 | tee up.log
          grep -q 'MinionWorker' up.log
          # Automatic start at boot and restart on failure (AC2).
          sc.exe qc MinionWorker | tee qc.txt
          grep -q 'AUTO_START' qc.txt
          sc.exe qfailure MinionWorker | tee qfailure.txt
          grep -q 'RESTART' qfailure.txt
          # The reset period is 86400 seconds (one day), not 10.
          grep -q '86400' qfailure.txt
      - name: The CLI reaches the service over the pipe of this user
        shell: bash
        run: |
          set -eu
          ok=0
          for _ in $(seq 1 60); do
            if ./minion.exe worker status --json > status.json 2> status.err \
              && grep -q '"live": true' status.json \
              && ! grep -q '"problems"' status.json; then
              ok=1
              break
            fi
            sleep 1
          done
          cat status.json || true
          cat status.err || true
          sc.exe query MinionWorker || true
          if [ "$ok" != 1 ]; then
            echo "the CLI did not reach the Windows service over its named pipe"
            exit 1
          fi
          grep -q '"preview": true' status.json
          grep -q '"platform": "windows"' status.json
      - name: The service restarts after its process is killed
        shell: bash
        # A new instance (another process id, or the same id with another
        # creation time) that is running and answers over the pipe. The
        # script writes every command to a file and checks its exit status;
        # a failure prints the polls, the last outputs, the SCM state and the
        # event log. Failure actions are the ones the install set (qfailure
        # above); nothing here changes them.
        run: scripts/windows-service-restart-probe.sh
      # Tray ticket W1b, acceptance 3: three Windows principals against the
      # installed service (tickets v3, Astra finding 3). The service serves the
      # pipe of the installing user (MINION_PIPE_USER_SID) only; no other
      # principal gets a pipe grant. scripts/windows-runas.ps1 runs a command
      # line as each principal without a window or a prompt:
      #   (a) the installer SID with an unelevated token: the SAFER "Normal
      #       User" level, what runas /trustlevel:0x20000 gives (Administrators
      #       deny-only), via CreateProcessAsUser;
      #   (b) a new standard user (New-LocalUser), via CreateProcessWithLogonW;
      #   (c) an alternate administrator, the same way.
      # The commands run C:\minion-ci\minion.exe, a copy every principal can
      # read; the service itself runs the minion.exe of the workspace that
      # "worker up" installed. After PR #69 the service runs its verified copy
      # %ProgramFiles%\Minion\minion.exe instead: the principals can then run
      # that one and the copy goes away; the assertions stay the same.
      - name: 'W1b principals: set up the principals and record the service environment'
        shell: pwsh
        run: |
          . ./scripts/windows-runas.ps1
          New-Item -ItemType Directory -Force -Path C:\minion-ci | Out-Null
          # Authenticated Users may write their results here.
          icacls C:\minion-ci /grant '*S-1-5-11:(OI)(CI)M' | Out-Null
          Copy-Item -LiteralPath minion.exe -Destination C:\minion-ci\minion.exe
          $uac = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').EnableLUA
          Write-Host "UAC EnableLUA = $uac"
          $envBefore = Get-CiServiceEnvironment
          $envBefore | Write-Host
          $pin = @($envBefore | Where-Object { $_ -like 'MINION_PIPE_USER_SID=*' })
          Assert-Ci ($pin.Count -eq 1) 'the service environment has one MINION_PIPE_USER_SID'
          $sid = $pin[0].Substring('MINION_PIPE_USER_SID='.Length)
          $me = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          Assert-Ci ($sid -eq $me) "the pinned pipe SID $sid is the installer $me"
          $envBefore | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'service-env-before.txt')
          "MINION_CI_PIPE=minion-worker-$sid" | Add-Content -LiteralPath $env:GITHUB_ENV
          # The credentials stay in the runner's temp directory (DPAPI of
          # this user), for the next steps.
          New-CiLocalUser -Name minion-std | Export-Clixml -LiteralPath (Join-Path $env:RUNNER_TEMP 'cred-std.xml')
          New-CiLocalUser -Name minion-adm2 -Admin | Export-Clixml -LiteralPath (Join-Path $env:RUNNER_TEMP 'cred-adm2.xml')
          # Positive control of the pipe probe: the installer reaches its pipe.
          $code = Invoke-AsSaferNormalUser -CommandLine (Get-CiPipeProbeCommandLine "minion-worker-$sid") -Out C:\minion-ci\probe-a.txt -Err C:\minion-ci\probe-a.err
          Show-CiFile C:\minion-ci\probe-a.txt
          Show-CiFile C:\minion-ci\probe-a.err
          Assert-Ci ($code -eq 0) "the installer's unelevated token connects to its pipe (probe exit $code)"
          Assert-Ci ((Get-CiServiceStatus) -eq 'Running') 'the service runs'
          exit 0
      - name: 'W1b principal b: a standard user is denied the pipe and the service'
        shell: pwsh
        run: |
          . ./scripts/windows-runas.ps1
          $cred = Import-Clixml -LiteralPath (Join-Path $env:RUNNER_TEMP 'cred-std.xml')
          $m = 'C:\minion-ci\minion.exe'
          $d = 'C:\minion-ci'
          $null = Invoke-AsCredential -Credential $cred -CommandLine 'whoami /user /groups' -Out "$d\b-whoami.txt" -Err "$d\b-whoami.err"
          Show-CiFile "$d\b-whoami.txt"
          # The pipe of the installer refuses this user.
          $code = Invoke-AsCredential -Credential $cred -CommandLine (Get-CiPipeProbeCommandLine $env:MINION_CI_PIPE) -Out "$d\b-probe.txt" -Err "$d\b-probe.err"
          Show-CiFile "$d\b-probe.txt"; Show-CiFile "$d\b-probe.err"
          Assert-Ci ($code -eq 5) "the installer's pipe denies the standard user (probe exit $code, want 5)"
          # Status: no live answer and no private field (pairing.code absent).
          $code = Invoke-AsCredential -Credential $cred -CommandLine "$m worker status --json" -Out "$d\b-status.json" -Err "$d\b-status.err"
          Show-CiFile "$d\b-status.json"; Show-CiFile "$d\b-status.err"
          $st = Get-Content -Raw "$d\b-status.json" | ConvertFrom-Json
          Assert-Ci (-not $st.live) 'the standard user gets no live answer'
          Assert-Ci (-not ($st.pairing.PSObject.Properties.Name -contains 'code')) 'pairing.code is absent'
          Assert-Ci ([string]::IsNullOrEmpty($st.pending_pairing_code)) 'pending_pairing_code is empty'
          # Stop without flags: the service runs but does not answer on this
          # user's pipe, so the sessions cannot be counted: 29.
          $code = Invoke-AsCredential -Credential $cred -CommandLine "$m worker stop --json" -Out "$d\b-stop.json" -Err "$d\b-stop.err"
          Show-CiFile "$d\b-stop.json"; Show-CiFile "$d\b-stop.err"
          Assert-Ci ($code -eq 29) "worker stop as a standard user exits 29 count_unavailable (got $code)"
          # Accepting the unknown loss reaches the SCM, which denies the stop: 21.
          $code = Invoke-AsCredential -Credential $cred -CommandLine "$m worker stop --accept-unknown-loss --json" -Out "$d\b-stop2.json" -Err "$d\b-stop2.err"
          Show-CiFile "$d\b-stop2.json"; Show-CiFile "$d\b-stop2.err"
          Assert-Ci ($code -eq 21) "worker stop --accept-unknown-loss as a standard user exits 21 needs_admin (got $code)"
          Assert-Ci ((Get-Content -Raw "$d\b-stop2.json" | ConvertFrom-Json).code -eq 'needs_admin') 'code needs_admin'
          Assert-Ci ((Get-CiServiceStatus) -eq 'Running') 'the service still runs'
          # Start (the service runs): the SCM denies the open: 21.
          $code = Invoke-AsCredential -Credential $cred -CommandLine "$m worker start --json" -Out "$d\b-start.json" -Err "$d\b-start.err"
          Show-CiFile "$d\b-start.json"; Show-CiFile "$d\b-start.err"
          Assert-Ci ($code -eq 21) "worker start as a standard user exits 21 needs_admin (got $code)"
          exit 0
      - name: 'W1b principal c: an alternate administrator is denied the pipe'
        shell: pwsh
        run: |
          . ./scripts/windows-runas.ps1
          $cred = Import-Clixml -LiteralPath (Join-Path $env:RUNNER_TEMP 'cred-adm2.xml')
          $m = 'C:\minion-ci\minion.exe'
          $d = 'C:\minion-ci'
          $null = Invoke-AsCredential -Credential $cred -CommandLine 'whoami /user /groups' -Out "$d\c-whoami.txt" -Err "$d\c-whoami.err"
          Show-CiFile "$d\c-whoami.txt"
          $admLine = @(Get-Content "$d\c-whoami.txt" | Where-Object { $_ -match 'S-1-5-32-544' })
          Assert-Ci ($admLine.Count -eq 1 -and $admLine[0] -notmatch 'deny only') 'the alternate administrator runs with an enabled Administrators group'
          $code = Invoke-AsCredential -Credential $cred -CommandLine (Get-CiPipeProbeCommandLine $env:MINION_CI_PIPE) -Out "$d\c-probe.txt" -Err "$d\c-probe.err"
          Show-CiFile "$d\c-probe.txt"; Show-CiFile "$d\c-probe.err"
          Assert-Ci ($code -eq 5) "the installer's pipe denies the alternate administrator (probe exit $code, want 5)"
          $null = Invoke-AsCredential -Credential $cred -CommandLine "$m worker status --json" -Out "$d\c-status.json" -Err "$d\c-status.err"
          Show-CiFile "$d\c-status.json"; Show-CiFile "$d\c-status.err"
          $st = Get-Content -Raw "$d\c-status.json" | ConvertFrom-Json
          Assert-Ci (-not $st.live) 'the alternate administrator gets no live answer'
          Assert-Ci (-not ($st.pairing.PSObject.Properties.Name -contains 'code')) 'pairing.code is absent'
          exit 0
      - name: 'W1b principal a: the installer, unelevated, stops the service over its pipe'
        shell: pwsh
        run: |
          . ./scripts/windows-runas.ps1
          $m = 'C:\minion-ci\minion.exe'
          $d = 'C:\minion-ci'
          $null = Invoke-AsSaferNormalUser -CommandLine 'whoami /user /groups' -Out "$d\a-whoami.txt" -Err "$d\a-whoami.err"
          Show-CiFile "$d\a-whoami.txt"
          $admLine = @(Get-Content "$d\a-whoami.txt" | Where-Object { $_ -match 'S-1-5-32-544' })
          Assert-Ci ($admLine.Count -eq 1 -and $admLine[0] -match 'deny only') 'the unelevated token has Administrators deny-only'
          $me = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          Assert-Ci ((Get-Content -Raw "$d\a-whoami.txt") -match [regex]::Escape($me)) 'the unelevated token is the installer SID'
          Assert-Ci ((Get-CiServiceStatus) -eq 'Running') 'the service runs before the stop'
          # worker stop sends worker_lifecycle+lifecycle.v1 over the pipe; the
          # Windows service stops itself (no SCM right is needed) and the CLI
          # waits until the pipe is gone and the state lock is free.
          $code = Invoke-AsSaferNormalUser -CommandLine "$m worker stop --json" -Out "$d\a-stop.json" -Err "$d\a-stop.err"
          Show-CiFile "$d\a-stop.json"; Show-CiFile "$d\a-stop.err"
          Assert-Ci ($code -eq 0) "worker stop by the unelevated installer exits 0 (got $code)"
          $res = Get-Content -Raw "$d\a-stop.json" | ConvertFrom-Json
          Assert-Ci ($res.ok -and $res.stopped) 'the result says ok and stopped'
          # Stopped, and it stays stopped (no recovery restart) for 10 seconds.
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-CiServiceStatus) -ne 'Stopped' -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          Assert-Ci ((Get-CiServiceStatus) -eq 'Stopped') 'the service stopped'
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            $s = Get-CiServiceStatus
            Assert-Ci ($s -eq 'Stopped') "the service stays stopped (state $s after $(($i + 1) / 2) s)"
          }
          sc.exe query MinionWorker
          exit 0
      - name: 'W1b principals c and b: start; the alternate administrator may, the standard user may not'
        shell: pwsh
        run: |
          . ./scripts/windows-runas.ps1
          $m = 'C:\minion-ci\minion.exe'
          $d = 'C:\minion-ci'
          Assert-Ci ((Get-CiServiceStatus) -eq 'Stopped') 'the service is stopped'
          $std = Import-Clixml -LiteralPath (Join-Path $env:RUNNER_TEMP 'cred-std.xml')
          $code = Invoke-AsCredential -Credential $std -CommandLine "$m worker start --json" -Out "$d\b-start2.json" -Err "$d\b-start2.err"
          Show-CiFile "$d\b-start2.json"; Show-CiFile "$d\b-start2.err"
          Assert-Ci ($code -eq 21) "worker start of a stopped service as a standard user exits 21 (got $code)"
          Assert-Ci ((Get-CiServiceStatus) -eq 'Stopped') 'the service is still stopped'
          $adm = Import-Clixml -LiteralPath (Join-Path $env:RUNNER_TEMP 'cred-adm2.xml')
          $code = Invoke-AsCredential -Credential $adm -CommandLine "$m worker start --json" -Out "$d\c-start.json" -Err "$d\c-start.err"
          Show-CiFile "$d\c-start.json"; Show-CiFile "$d\c-start.err"
          Assert-Ci ($code -eq 0) "worker start by the alternate administrator exits 0 (got $code)"
          # The start changed nothing in the service: the pipe stays the
          # installer's (MINION_PIPE_USER_SID unchanged).
          $before = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'service-env-before.txt')
          $after = Get-CiServiceEnvironment
          $after | Write-Host
          Assert-Ci (($before -join "`n") -eq ($after -join "`n")) 'the service environment (MINION_PIPE_USER_SID) is unchanged'
          # The service runs again and answers the installer, not the
          # alternate administrator.
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            & ./minion.exe worker status --json > status-c.json 2> status-c.err
            $ok = ((Get-Content -Raw status-c.json | ConvertFrom-Json).live -eq $true)
            if (-not $ok) { Start-Sleep -Seconds 1 }
          }
          Assert-Ci $ok 'the installer reaches the restarted service over its pipe'
          $code = Invoke-AsCredential -Credential $adm -CommandLine (Get-CiPipeProbeCommandLine $env:MINION_CI_PIPE) -Out "$d\c-probe2.txt" -Err "$d\c-probe2.err"
          Show-CiFile "$d\c-probe2.txt"
          Assert-Ci ($code -eq 5) "the pipe still denies the alternate administrator (probe exit $code)"
          exit 0
      - name: Stop the service; the installing user still reads the state
        shell: bash
        run: |
          set -eu
          sc.exe stop MinionWorker
          stopped=0
          # The query goes to a file and is read from there: grep -q on a pipe
          # makes the producer fail, and pipefail then makes that false.
          for _ in $(seq 1 60); do
            sc.exe query MinionWorker > query.txt 2> query.err || true
            if grep -q 'STOPPED' query.txt; then
              stopped=1
              break
            fi
            sleep 1
          done
          if [ "$stopped" != 1 ]; then
            echo "the service did not stop"
            cat query.txt query.err || true
            exit 1
          fi
          # The service ran as LocalSystem. This process runs as the runner
          # user: the state directory and the database must still be readable
          # (the private DACL names the installing user and SYSTEM), and the
          # CLI must report them without a problem.
          ./minion.exe worker status --json > after.json
          cat after.json
          if grep -q '"problems"' after.json; then
            echo "the installing user cannot use the state after the service ran"
            exit 1
          fi
          grep -q '"live": false' after.json
          # The state of the service is also deletable by this user.
          test -f "$MINION_STATE_DIR/worker.db"
          cp "$MINION_STATE_DIR/worker.db" "$RUNNER_TEMP/worker.db.copy"
      - name: Remove the service
        if: always()
        shell: bash
        run: |
          sc.exe stop MinionWorker || true
          sc.exe delete MinionWorker || true
          net user minion-std /delete || true
          net user minion-adm2 /delete || true

  psmux:
    # v0.9.0 spike: the tmux adapter drives psmux (tmux-compatible server for
    # Windows), and a session survives a new Host (a restarted Worker).
    name: psmux session host (tmux adapter)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PSMUX_VERSION: v3.4.0
      PSMUX_SHA256: a66b6be7c13c6fa0dc3660a267b9e34eaa91a4eb7f07fbd55a0468018bd0f721
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install psmux (pinned release, checksum verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'psmux.zip'
          Invoke-WebRequest -Uri "https://github.com/psmux/psmux/releases/download/$env:PSMUX_VERSION/psmux-$env:PSMUX_VERSION-windows-x64.zip" -OutFile $zip
          $sum = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          if ($sum -ne $env:PSMUX_SHA256) { throw "psmux checksum mismatch: $sum" }
          $dir = Join-Path $env:RUNNER_TEMP 'psmux'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $exe = Get-ChildItem -Path $dir -Recurse -Filter psmux.exe | Select-Object -First 1
          if (-not $exe) { throw 'psmux.exe not found in the archive' }
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
          & $exe.FullName -V
      - name: tmux adapter against psmux
        shell: bash
        env:
          MINION_REQUIRE_PSMUX: "1"
        run: CGO_ENABLED=0 go test -count=1 -v -tags psmux -run Psmux ./internal/worker/term/tmux/
