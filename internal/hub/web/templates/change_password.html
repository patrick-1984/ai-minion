{{define "content"}}
<section class="card auth-card">
  <h1>Change password</h1>
  {{if .Data.MustChange}}<p>You must choose a new password before you can use the Hub.</p>{{end}}
  <form method="post" action="{{.Data.Action}}" data-json-action="{{.Data.Action}}" data-next="/" data-request-id data-match="new_password,confirm_password">
    <p class="form-error" role="alert" data-form-error hidden></p>
    <div class="field">
      <label for="old_password">Current password</label>
      <input type="password" id="old_password" name="old_password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new_password">New password</label>
      <input type="password" id="new_password" name="new_password" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label for="confirm_password">Repeat the new password</label>
      <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
    </div>
    <button type="submit">Change password</button>
  </form>
  <noscript><p class="muted">Changing the password needs JavaScript in this browser.</p></noscript>
</section>
{{end}}
