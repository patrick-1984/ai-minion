# Minion Hub from the registry image (docs/install/hub-docker.md).
#
# Preparation, once, in the directory that holds this file:
#
#   1. The first administrator's password goes in the file .env next to this file:
#        (umask 077 && printf "MINION_ADMIN_PASSWORD='%s'\n" 'choose-a-strong-password' >> .env)
#      The single quotes keep characters such as $ literal; the password must
#      not contain a single quote. umask 077 keeps a new .env private.
#      The Hub uses it only on the first start (while it has no users); you may
#      remove it from .env afterwards. Without it the Hub generates a random
#      password and logs it once.
#   2. docker compose -f hub.yaml up -d
#
# The image runs as UID 65532. The "init" service gives that user the data
# directory (it is the same as running, on the host,
#   sudo mkdir -p ./hub-data && sudo chown 65532:65532 ./hub-data
# before "docker compose up"; do that instead if you prefer to run no root container).
#
# MINION_VERSION selects the image tag: an exact version (v0.20.6), which is the
# default here, or a channel tag such as 0.8 or latest.
#
# The Hub speaks HTTPS on 8443 with a certificate it generates on first start
# (its fingerprint is in the log). The port is published on the loopback
# interface only: put a reverse proxy in front (docs/guides/reverse-proxy.md), or
# publish "8443:8443" to reach the Hub directly from other machines.
services:
  init:
    image: busybox:1.37
    user: "0:0"
    command:
      - sh
      - -c
      - chown -R 65532:65532 /data
    volumes:
      - ./hub-data:/data

  hub:
    image: ghcr.io/patrick-1984/minion:${MINION_VERSION:-v0.20.6}
    command: ["hub", "serve"]
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      MINION_DATA_DIR: /data
      MINION_ADMIN_PASSWORD: ${MINION_ADMIN_PASSWORD:-}
      # Behind a reverse proxy that ends TLS, uncomment these three (see
      # docs/guides/reverse-proxy.md). The trusted proxy is the exact address of
      # the proxy, never a shared network or 0.0.0.0/0.
      # MINION_TLS: "off"
      # MINION_PUBLIC_URL: https://hub.example.com
      # MINION_TRUSTED_PROXIES: 172.18.0.2/32
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./hub-data:/data
